name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: sh tests/smoke.sh

  release:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: sha256sum ghsb > ghsb.sha256
      - run: gh release create "$GITHUB_REF_NAME" ghsb install.sh ghsb.sha256 --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
